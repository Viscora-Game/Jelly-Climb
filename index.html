<!DOCTYPE html>
<html lang="tr" style="background:#090d16">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#03050a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <title>Jelly Climb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" /></noscript>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #game-canvas {
      display: block;
      aspect-ratio: 9 / 16;
      height: min(100dvh, calc(100vw * 16 / 9));
      width: min(100vw, calc(100dvh * 9 / 16));
      max-width: 100vw;
      max-height: 100dvh;
      touch-action: none;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
      border-radius: 0;
    }

    @media (orientation: landscape) {
      #game-canvas {
        border-radius: 14px;
      }
    }

    @media (orientation: portrait) {
      #game-canvas {
        width: 100vw;
        height: 100%;
        height: 100dvh;
        max-width: 100vw;
        max-height: 100dvh;
        aspect-ratio: auto;
        box-shadow: none;
        border-radius: 0;
      }
    }

    #nick-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(6, 10, 20, 0.78);
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
    }

    #nick-overlay.open {
      display: flex;
    }

    .nick-card {
      width: min(320px, 88vw);
      background: linear-gradient(180deg, #223452, #142036);
      border: 2.5px solid #36f5b0;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-family: "Fredoka", sans-serif;
      text-align: center;
    }

    .nick-card h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #8affdb;
    }

    .nick-card input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid rgba(165, 205, 255, 0.35);
      background: #0a1220;
      color: #ffffff;
      font-family: "Fredoka", sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .nick-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .nick-actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 14px;
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    #nick-cancel-btn {
      background: #283c5e;
      color: #dce8ff;
    }

    #nick-save-btn {
      background: #36f5b0;
      color: #06241b;
    }

    /* CyberCore Interactive Studio Intro (fitted cleanly to 9:16 portrait screen frame) */
    #cybercore-intro-stage {
      --intro-w: min(100vw, calc(100dvh * 9 / 16));
      position: fixed;
      inset: 0;
      z-index: 60;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s ease;
    }

    #cybercore-intro-stage.intro-fading {
      opacity: 0;
      pointer-events: none;
    }

    #cybercore-intro-stage.intro-hidden {
      display: none;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-canvas-frame {
      position: relative;
      aspect-ratio: 9 / 16;
      height: min(100dvh, calc(100vw * 16 / 9));
      width: var(--intro-w);
      max-width: 100vw;
      max-height: 100dvh;
      background: radial-gradient(circle at center, #0a1428 0%, #03050a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.72);
      border-radius: 0;
    }

    @media (orientation: landscape) {
      .intro-canvas-frame {
        border-radius: 14px;
      }
    }

    @media (orientation: portrait) {
      .intro-canvas-frame {
        width: 100vw;
        height: 100%;
        height: 100dvh;
        max-width: 100vw;
        max-height: 100dvh;
        aspect-ratio: auto;
        box-shadow: none;
        border-radius: 0;
      }
    }

    .intro-grid {
      position: absolute;
      inset: -40px;
      background-image:
        linear-gradient(rgba(0, 242, 254, 0.065) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.065) 1px, transparent 1px);
      background-size: calc(var(--intro-w) * 0.088) calc(var(--intro-w) * 0.088);
      background-position: center center;
      opacity: 0.3;
      animation: introGridDrift 2.6s linear infinite;
      pointer-events: none;
    }

    @keyframes introGridDrift {
      0% { transform: translateY(0); }
      100% { transform: translateY(calc(var(--intro-w) * 0.088)); }
    }

    .intro-scanbeam {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 5%, rgba(0, 242, 254, 0.65) 50%, transparent 95%);
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.75);
      opacity: 0;
      animation: introScanMove 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      pointer-events: none;
    }

    @keyframes introScanMove {
      0% { top: 12%; opacity: 0; }
      20% { opacity: 0.85; }
      85% { opacity: 0.45; }
      100% { top: 88%; opacity: 0; }
    }

    .intro-ring {
      position: absolute;
      width: calc(var(--intro-w) * 0.42);
      height: calc(var(--intro-w) * 0.42);
      border-radius: 50%;
      border: 1.5px solid rgba(0, 242, 254, 0.55);
      box-shadow: 0 0 22px rgba(0, 242, 254, 0.32);
      opacity: 0;
      animation: introRingPulse 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.12s;
      pointer-events: none;
    }

    .intro-ring-delay {
      animation-delay: 0.42s;
      border-color: rgba(54, 245, 176, 0.45);
    }

    @keyframes introRingPulse {
      0% { transform: scale(0.55); opacity: 0.85; }
      100% { transform: scale(2.15); opacity: 0; }
    }

    .intro-glow-aura {
      position: absolute;
      width: calc(var(--intro-w) * 0.78);
      height: calc(var(--intro-w) * 0.78);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.42) 0%, rgba(56, 189, 248, 0.14) 50%, transparent 75%);
      filter: blur(48px);
      opacity: 0.92;
      pointer-events: none;
    }

    .intro-logo-box {
      position: relative;
      z-index: 10;
      max-width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--intro-w) * 0.036);
      animation: cyberSnap 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cyberSnap {
      0% { opacity: 0; transform: scale(0.86); filter: blur(8px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0px); }
    }

    .vector-ci-logo {
      width: calc(var(--intro-w) * 0.30);
      height: calc(var(--intro-w) * 0.30);
      flex-shrink: 0;
      filter: drop-shadow(0 0 18px rgba(0, 242, 254, 0.8)) drop-shadow(0 0 34px rgba(2, 132, 199, 0.45));
      animation: cyberPulse 3s ease-in-out infinite alternate;
    }

    @keyframes cyberPulse {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-4px) scale(1.02); }
    }

    .intro-brand-title {
      font-family: 'Orbitron', "Fredoka", sans-serif;
      font-size: calc(var(--intro-w) * 0.088);
      font-weight: 900;
      letter-spacing: calc(var(--intro-w) * 0.012);
      background: linear-gradient(135deg, #ffffff 20%, #00f2fe 70%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 28px rgba(0, 242, 254, 0.52);
      line-height: 1.05;
      position: relative;
      overflow: hidden;
      padding-right: 0;
      white-space: nowrap;
    }

    .intro-brand-subtitle {
      font-family: 'Orbitron', "Plus Jakarta Sans", sans-serif;
      font-size: calc(var(--intro-w) * 0.028);
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: calc(var(--intro-w) * 0.025);
      text-transform: uppercase;
      margin-right: calc(var(--intro-w) * -0.025);
      opacity: 0.95;
      white-space: nowrap;
    }

    .intro-light-sweep {
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.78), transparent);
      transform: skewX(-25deg);
      animation: cyberSweep 1.35s ease-in-out forwards 0.1s;
      pointer-events: none;
    }

    @keyframes cyberSweep {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    .intro-skip-hint {
      position: absolute;
      bottom: calc(var(--intro-w) * 0.095);
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: calc(var(--intro-w) * 0.024);
      font-weight: 700;
      color: rgba(148, 163, 184, 0.72);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
    }

    .intro-loader-track {
      position: absolute;
      bottom: calc(var(--intro-w) * 0.055);
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--intro-w) * 0.34);
      height: 3px;
      border-radius: 99px;
      background: rgba(148, 163, 184, 0.18);
      overflow: hidden;
      pointer-events: none;
    }

    .intro-loader-fill {
      width: 0%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #00f2fe, #36f5b0);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.7);
      animation: introLoadFill 1.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes introLoadFill {
      0% { width: 6%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- CYBERCORE INTERACTIVE - STUDIO INTRO SPLASH SCREEN -->
  <div id="cybercore-intro-stage" role="presentation" aria-label="CyberCore Interactive">
    <div class="intro-canvas-frame">
      <div class="intro-grid"></div>
      <div class="intro-scanbeam"></div>
      <div class="intro-glow-aura"></div>
      <div class="intro-ring"></div>
      <div class="intro-ring intro-ring-delay"></div>
      <div class="intro-logo-box">
        <svg class="vector-ci-logo" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="30%" stop-color="#cbd5e1" />
              <stop offset="70%" stop-color="#64748b" />
              <stop offset="100%" stop-color="#334155" />
            </linearGradient>
            <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#00f2fe" />
            </linearGradient>
            <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.9" />
            </filter>
          </defs>
          <path d="M 125 35 A 72 72 0 1 0 90 172 L 90 148 A 48 48 0 1 1 112 56 Z"
                fill="url(#metalGrad)"
                stroke="#00f2fe"
                stroke-width="1.5"
                filter="url(#neonGlow)" />
          <path d="M 134 26 L 160 48 L 144 65 L 122 46 Z"
                fill="url(#metalGrad)"
                stroke="#00f2fe"
                stroke-width="1.5"
                filter="url(#neonGlow)" />
          <rect x="94" y="78" width="22" height="66" rx="2"
                fill="url(#metalGrad)"
                stroke="#00f2fe"
                stroke-width="1.5"
                filter="url(#neonGlow)" />
          <rect x="94" y="50" width="22" height="20" rx="2"
                fill="url(#cyanGrad)"
                stroke="#ffffff"
                stroke-width="1"
                filter="drop-shadow(0 0 10px #00f2fe)" />
        </svg>

        <h1 class="intro-brand-title">
          CYBERCORE
          <div class="intro-light-sweep"></div>
        </h1>
        <div class="intro-brand-subtitle">INTERACTIVE</div>
      </div>
      <div class="intro-skip-hint" id="intro-skip-hint">Geçmek için dokun • Tap to skip</div>
      <div class="intro-loader-track"><div class="intro-loader-fill"></div></div>
    </div>
  </div>

  <canvas id="game-canvas" aria-label="Jelly Climb Oyun Alanı"></canvas>

  <div id="nick-overlay" role="dialog" aria-modal="true">
    <form class="nick-card" id="nick-form">
      <h3 id="nick-modal-title">Choose Nickname</h3>
      <input id="nick-input" type="text" maxlength="12" minlength="2" autocomplete="off" />
      <div class="nick-actions">
        <button type="button" id="nick-cancel-btn">CANCEL</button>
        <button type="submit" id="nick-save-btn">SAVE</button>
      </div>
    </form>
  </div>

  <script>
    (function () {
      var stage = document.getElementById('cybercore-intro-stage');
      if (!stage) return;

      var hint = document.getElementById('intro-skip-hint');
      try {
        var lang = localStorage.getItem('jelly_climb_lang');
        if (hint && lang === 'tr') hint.textContent = 'Geçmek için dokun';
        else if (hint && lang === 'en') hint.textContent = 'Tap to skip';
      } catch (_) {}

      var introAudio = null;
      function stopIntroAudio() {
        if (introAudio) {
          try { introAudio.pause(); } catch (_) {}
          introAudio = null;
        }
      }

      try {
        if (!document.hidden && localStorage.getItem('jelly_climb_sound') !== '0') {
          introAudio = new Audio('assets/audio/cybercore_sound_2_hollywood.wav?v=25');
          introAudio.volume = 0.85;
          var p = introAudio.play();
          if (p && typeof p.catch === 'function') p.catch(function () {});
        }
      } catch (_) {}

      var done = false;
      function finishIntro(fast) {
        if (done) return;
        done = true;
        stage.classList.add('intro-fading');
        setTimeout(function () {
          stage.classList.add('intro-hidden');
          stopIntroAudio();
        }, fast ? 180 : 460);
      }

      function onIntroBackground() {
        if (document.hidden) {
          stopIntroAudio();
        }
      }

      document.addEventListener('visibilitychange', onIntroBackground);
      window.addEventListener('pagehide', stopIntroAudio);

      var fadeTimer = setTimeout(function () {
        finishIntro(false);
      }, 2000);

      stage.addEventListener('pointerdown', function (e) {
        e.stopPropagation();
        e.preventDefault();
        clearTimeout(fadeTimer);
        finishIntro(true);
      });
    })();
  </script>

  <script defer src="src/constants.js?v=29"></script>
  <script defer src="src/i18n.js?v=29"></script>
  <script defer src="src/audio.js?v=29"></script>
  <script defer src="src/particles.js?v=29"></script>
  <script defer src="src/accessories.js?v=29"></script>
  <script defer src="src/abilities.js?v=29"></script>
  <script defer src="src/collectibles.js?v=29"></script>
  <script defer src="src/player.js?v=29"></script>
  <script defer src="src/obstacles.js?v=29"></script>
  <script defer src="src/bosses.js?v=29"></script>
  <script defer src="src/levelGenerator.js?v=29"></script>
  <script defer src="src/leaderboard.js?v=29"></script>
  <script defer src="src/game.js?v=29"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
