<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>Jelly Climb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #game-canvas {
      display: block;
      aspect-ratio: 9 / 16;
      height: min(100dvh, calc(100vw * 16 / 9));
      width: min(100vw, calc(100dvh * 9 / 16));
      max-width: 100vw;
      max-height: 100dvh;
      touch-action: none;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
      border-radius: 0;
    }

    @media (min-aspect-ratio: 9/16) {
      #game-canvas {
        border-radius: 14px;
      }
    }

    #nick-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(6, 10, 20, 0.78);
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
    }

    #nick-overlay.open {
      display: flex;
    }

    .nick-card {
      width: min(320px, 88vw);
      background: linear-gradient(180deg, #223452, #142036);
      border: 2.5px solid #36f5b0;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-family: "Fredoka", sans-serif;
      text-align: center;
    }

    .nick-card h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #8affdb;
    }

    .nick-card input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid rgba(165, 205, 255, 0.35);
      background: #0a1220;
      color: #ffffff;
      font-family: "Fredoka", sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .nick-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .nick-actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 14px;
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    #nick-cancel-btn {
      background: #283c5e;
      color: #dce8ff;
    }

    #nick-save-btn {
      background: #36f5b0;
      color: #06241b;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" aria-label="Jelly Climb Oyun Alanı"></canvas>

  <div id="nick-overlay" role="dialog" aria-modal="true">
    <form class="nick-card" id="nick-form">
      <h3 id="nick-modal-title">Choose Nickname</h3>
      <input id="nick-input" type="text" maxlength="12" minlength="2" autocomplete="off" />
      <div class="nick-actions">
        <button type="button" id="nick-cancel-btn">CANCEL</button>
        <button type="submit" id="nick-save-btn">SAVE</button>
      </div>
    </form>
  </div>

  <script defer src="src/constants.js?v=16"></script>
  <script defer src="src/i18n.js?v=16"></script>
  <script defer src="src/audio.js?v=16"></script>
  <script defer src="src/particles.js?v=16"></script>
  <script defer src="src/accessories.js?v=16"></script>
  <script defer src="src/abilities.js?v=16"></script>
  <script defer src="src/collectibles.js?v=16"></script>
  <script defer src="src/player.js?v=16"></script>
  <script defer src="src/obstacles.js?v=16"></script>
  <script defer src="src/bosses.js?v=16"></script>
  <script defer src="src/levelGenerator.js?v=16"></script>
  <script defer src="src/leaderboard.js?v=16"></script>
  <script defer src="src/game.js?v=16"></script>
</body>
</html>
