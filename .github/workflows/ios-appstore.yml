name: iOS Build & App Store Connect Upload

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode (verify-compile needs no Apple secrets; upload-testflight signs & uploads to App Store Connect)'
        required: true
        default: 'verify-compile'
        type: choice
        options:
          - verify-compile
          - upload-testflight
      marketing_version:
        description: 'App Store Version (CFBundleShortVersionString, e.g. 1.0.0)'
        required: false
        default: '1.0.0'
        type: string
      build_number:
        description: 'Optional Build Number (leave empty to auto-use GitHub run number)'
        required: false
        default: ''
        type: string

jobs:
  ios-build:
    name: Build Jelly Climb iOS (${{ inputs.mode }})
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build native web bundle & sync Capacitor iOS
        run: |
          npm run build:native
          npx cap sync ios

      - name: Select latest Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Verify Release Compile (No Apple Secrets Needed)
        if: inputs.mode == 'verify-compile'
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Validate Apple Secrets for App Store Upload
        if: inputs.mode == 'upload-testflight'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          for var in APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required GitHub Secret: $var (see IOS_APPSTORE_REHBER.md)"
              exit 1
            fi
          done

      - name: Configure App Store Connect API Key & ExportOptions
        if: inputs.mode == 'upload-testflight'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive & Upload Directly to App Store Connect / TestFlight
        if: inputs.mode == 'upload-testflight'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          MARKETING_VER: ${{ inputs.marketing_version }}
          CUSTOM_BUILD_NUM: ${{ inputs.build_number }}
        run: |
          BUILD_NUM="${CUSTOM_BUILD_NUM:-$GITHUB_RUN_NUMBER}"
          echo "Archiving Jelly Climb v${MARKETING_VER} (build ${BUILD_NUM}) for Team ${APPLE_TEAM_ID}..."

          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/JellyClimb.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VER" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

          xcodebuild -exportArchive \
            -archivePath build/JellyClimb.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

      - name: Cleanup Temporary Key
        if: always()
        run: rm -rf "$HOME/private_keys" ios/ExportOptions.plist
